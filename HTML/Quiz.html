<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/hovedstyle.css" />
    <link rel="stylesheet" href="../CSS/Quizstyle.css" />
    <script type="module" src="../JS/questions.js"></script>
    <script type="module" src="../JS/Quiz.js"></script>
    <title>Document</title>
  </head>
  <body>
    <video class="bgVideo" autoplay muted loop playsinline>
      <source src="../Medie/Videoer/MarketPliers.mp4" type="video/mp4" />
    </video>
    <a href="../index.html" class="exitBtn">Back</a>

    <div id="quiz-container">
      <div id="question-container">
        <h2 id="question"></h2>
        <div id="options">
          <button class="option-btn" data-index="0"></button>
          <button class="option-btn" data-index="1"></button>
          <button class="option-btn" data-index="2"></button>
        </div>
      </div>
      <div id="result-container" style="display: none">
        <h2>Quiz Complete!</h2>
        <p id="score"></p>
        <button id="restart-btn">Restart Quiz</button>
      </div>
    </div>

    <script>
      (function setMonthFavicon() {
        const month = new Date().getMonth() + 1; // 1–12
        const iconMap = {
          spring: "../Medie/Icons/springicon.png", // Mar–May
          summer: "../Medie/Icons/summericon.png", // Jun–Aug
          autumn: "../Medie/Icons/autumnicon.png", // Sep–Nov
          winter: "../Medie/Icons/wintericon.png", // Dec–Feb
        };

        let chosen = iconMap.winter;
        if (month >= 3 && month <= 5) chosen = iconMap.spring;
        else if (month >= 6 && month <= 8) chosen = iconMap.summer;
        else if (month >= 9 && month <= 11) chosen = iconMap.autumn;

        let link = document.getElementById("favicon");
        if (!link) {
          link = document.createElement("link");
          link.id = "favicon";
          link.rel = "icon";
          link.type = "image/png";
          document.head.appendChild(link);
        }

        // Add a cache-busting param so browsers pick up changes when month changes
        link.href = chosen + "?m=" + month;
      })();
    </script>
  </body>
</html>
