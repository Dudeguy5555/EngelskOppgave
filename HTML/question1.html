<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/hovedstyle.css" />
    <link rel="stylesheet" href="../CSS/Quizstyle.css" />
    <title>Question 1</title>
  </head>
  <body>
    <video class="bgVideo" autoplay muted loop playsinline>
      <source src="../Medie/Videoer/MarketPliers.mp4" type="video/mp4" />
    </video>
    <header>
      <div class="headerHolder">
        <div class="titleHolder">
          <h1>Question 1</h1>
        </div>
      </div>
      <a href="Quiz.html" class="exitBtn">Back</a>
    </header>
    <div class="quizContainer">
      <div id="question"></div>
    </div>

    <script>
      (function setMonthFavicon() {
        const month = new Date().getMonth() + 1; // 1–12
        const iconMap = {
          spring: "../Medie/Icons/springicon.png", // Mar–May
          summer: "../Medie/Icons/summericon.png", // Jun–Aug
          autumn: "../Medie/Icons/autumnicon.png", // Sep–Nov
          winter: "../Medie/Icons/wintericon.png", // Dec–Feb
        };

        let chosen = iconMap.winter;
        if (month >= 3 && month <= 5) chosen = iconMap.spring;
        else if (month >= 6 && month <= 8) chosen = iconMap.summer;
        else if (month >= 9 && month <= 11) chosen = iconMap.autumn;

        let link = document.getElementById("favicon");
        if (!link) {
          link = document.createElement("link");
          link.id = "favicon";
          link.rel = "icon";
          link.type = "image/png";
          document.head.appendChild(link);
        }

        link.href = chosen + "?m=" + month;
      })();
    </script>
    <script src="../JS/questions.js"></script>
    <script>
      const questionIndex = 0;
      const q = questions[questionIndex];
      const questionDiv = document.getElementById("question");
      questionDiv.innerHTML = `<div class="question">${q.question}</div>
        <div class="options">
          ${q.options
            .map(
              (option, i) =>
                `<div class="option" onclick="selectOption(${i})">${option}</div>`
            )
            .join("")}
        </div>`;

      function selectOption(optionIndex) {
        // Save answer
        let answers = JSON.parse(localStorage.getItem("quizAnswers")) || [];
        answers[questionIndex] = optionIndex;
        localStorage.setItem("quizAnswers", JSON.stringify(answers));
        // Go to next
        window.location.href = "question2.html";
      }
    </script>
  </body>
</html>
